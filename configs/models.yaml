schema_version: "2.0-final"
runtime:
  random_seed: 20260831
  deterministic: true
  n_jobs: -1
anomaly:
  channels: [robust_population, isolation_forest, temporal, multivariate]
  channel_rank_cap: 0.99
  fusion:
    method: logistic_stacker
    fit_split: val
    per_family: true
  isolation_forest:
    n_estimators: 300
    contamination: 0.05
  decision_features:
    include_absolute_violation: true
forecast:
  models: [persistence, linear, ridge, gradient_boosting]
  target_horizon_h: 168.0
  selection_split: val
  one_model_per_family_parameter: true
failure_risk:
  enabled: true
  objective: "P(failure <= 168h)"
  model: hist_gradient_boosting
  calibration: isotonic
  ood_excluded_from_risk: true
ood:
  family_method: robust_mahalanobis
  parameter_method: robust_mahalanobis
  covariance: ledoit_wolf
  secondary_method: knn
  q95: 0.95
  q99: 0.99
uncertainty:
  method: finite_sample_conformal
  nominal_coverage: 0.95
lifecycle:
  champion_challenger: true
  drift_monitoring: true
