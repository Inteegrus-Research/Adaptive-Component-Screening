# ACS Master Parameter Ontology
# Deployment note:
# Engineering limits are intentionally configuration-driven. Authoritative
# component/mission specifications must override these prototype defaults.

families:
  - DIGITAL_LOGIC
  - MMIC_ANALOG
  - POWER_REGULATOR
  - CAPACITOR
  - SENSOR_IF
  - POWER_SEMICONDUCTOR
  - UNKNOWN

units:
  current:
    A: 1000000.0
    mA: 1000.0
    uA: 1.0
    nA: 0.001
  voltage:
    V: 1.0
    mV: 0.001
    uV: 0.000001
    kV: 1000.0
  temperature:
    C: 1.0
    degC: 1.0
    K: 1.0
  resistance:
    Ohm: 1.0
    kohm: 1000.0
    Mohm: 1000000.0
  dimensionless:
    "1": 1.0
    dB: 1.0

schema:
  aliases:
    component_id:
      - component_id
      - component
      - part_id
      - part_no
      - device_id
      - device
      - serial
      - serial_number

    lot_id:
      - lot_id
      - lot
      - lot_no
      - wafer_lot
      - lot_code

    batch_id:
      - batch_id
      - batch
      - batch_no
      - batch_code
      - production_batch

    family:
      - family
      - component_family
      - component_type
      - device_family
      - device_type

    parameter:
      - parameter
      - parameter_name
      - metric
      - signal
      - variable
      - measurement

    value:
      - value
      - reading
      - measurement_value
      - measured_value
      - test_value

    unit:
      - unit
      - units

    time_h:
      - time_h
      - time
      - hours
      - burnin_hours
      - burn_in_hours
      - burnintime
      - burn_in_time
      - timestamp

    temperature:
      - temperature
      - temperature_c
      - temp
      - temp_c
      - burnin_temperature_c
      - burn_in_temperature_c

wide_format:
  time_patterns:
    - '^t_?([0-9]+(?:\.[0-9]+)?)h$'
    - '^([0-9]+(?:\.[0-9]+)?)h$'
    - '^value_?([0-9]+(?:\.[0-9]+)?)h$'

parameters:

  quiescent_current:
    aliases:
      - iddq
      - iddq_uA
      - iddq_ua
      - quiescent_current
      - quiescent_current_ua
      - iq
      - i_q
      - supply_current
    physical_quantity: current
    canonical_unit: uA
    engineering_limit:
      lower: 0.0
      upper: 5000.0
    warning_limit:
      lower: 0.0
      upper: 4000.0
    default_drift_tolerance:
      absolute: 0.05
      relative: 0.10

  input_leakage_current:
    aliases:
      - pin_7_leakage
      - pin7_leakage
      - leak_current
      - leakage_current
      - leakage_current_ua
      - leakage_current_na
      - ileak
      - i_leak
      - input_leakage
    physical_quantity: current
    canonical_unit: uA
    engineering_limit:
      lower: 0.0
      upper: 1000.0
    warning_limit:
      lower: 0.0
      upper: 750.0
    default_drift_tolerance:
      absolute: 0.10
      relative: 0.15

  voltage:
    aliases:
      - voltage
      - voltage_v
      - supply_voltage
      - supply_voltage_v
      - vcc
      - vdd
      - input_voltage
    physical_quantity: voltage
    canonical_unit: V
    engineering_limit:
      lower: 0.0
      upper: 100.0
    warning_limit:
      lower: 0.0
      upper: 90.0
    default_drift_tolerance:
      absolute: 0.02
      relative: 0.05

  output_voltage:
    aliases:
      - output_voltage
      - output_voltage_v
      - output_v
      - vout
      - vout_v
    physical_quantity: voltage
    canonical_unit: V
    engineering_limit:
      lower: 0.0
      upper: 100.0
    warning_limit:
      lower: 0.0
      upper: 95.0
    default_drift_tolerance:
      absolute: 0.02
      relative: 0.05

  output_current:
    aliases:
      - output_current
      - output_current_a
      - load_current
      - iout
      - current
    physical_quantity: current
    canonical_unit: uA
    engineering_limit:
      lower: 0.0
      upper: 5000000.0
    warning_limit:
      lower: 0.0
      upper: 4500000.0
    default_drift_tolerance:
      absolute: 0.05
      relative: 0.10

  temperature:
    aliases:
      - temperature
      - temperature_c
      - temp
      - temp_c
      - degc
      - burnin_temperature
      - burnin_temperature_c
    physical_quantity: temperature
    canonical_unit: C
    engineering_limit:
      lower: -55.0
      upper: 150.0
    warning_limit:
      lower: -40.0
      upper: 125.0
    default_drift_tolerance:
      absolute: 2.0
      relative: 0.05

  esr:
    aliases:
      - esr
      - esr_ohm
      - equivalent_series_resistance
      - equivalent_series_resistance_ohm
    physical_quantity: resistance
    canonical_unit: Ohm
    engineering_limit:
      lower: 0.0
      upper: 1.20
    warning_limit:
      lower: 0.0
      upper: 1.00
    default_drift_tolerance:
      absolute: 0.05
      relative: 0.10

  gain:
    aliases:
      - gain
      - gain_db
      - rf_gain
      - optical_gain
    physical_quantity: dimensionless
    canonical_unit: dB
    engineering_limit:
      lower: -20.0
      upper: 80.0
    warning_limit:
      lower: -15.0
      upper: 75.0
    default_drift_tolerance:
      absolute: 0.50
      relative: 0.10