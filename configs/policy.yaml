thresholds:
  max_target_fpr: 0.05

  risk_reject_threshold: 0.75
  risk_review_threshold: 0.40

  ood_novelty_threshold: 0.70
  max_uncertainty_threshold: 0.65

  anomaly_review_threshold: 0.60
  rapid_degradation_threshold: 0.60

  crossing_confidence_threshold: 0.80

fallbacks:
  DEGRADED:
    no_forecast: REVIEW
    insufficient_reference: REVIEW
    high_uncertainty: REVIEW
    missing_engineering_limit: REVIEW
    default: REVIEW

  COLD_START:
    low_risk: PASS
    moderate_risk: REVIEW
    high_risk: REVIEW
    predicted_crossing_high_confidence: REJECT
    high_ood: UNKNOWN
    default: REVIEW

  INSUFFICIENT:
    default: UNKNOWN

  UNKNOWN:
    default: UNKNOWN

ood:
  min_reference_rows: 12
  known_family_distance_quantile: 0.99
  robust_scale_epsilon: 0.000001

risk:
  weights:
    anomaly: 0.40
    crossing: 0.30
    acceleration: 0.20
    proximity: 0.10

  calibration:
    slope: 4.0
    intercept: -2.0

forecast:
  horizon_h: 168.0
  min_component_points: 2
  min_training_components: 4
  min_training_rows: 24
  conformal_alpha: 0.05
  min_calibration_residuals: 8
  cold_start_min_points_for_trend: 3
  uncertainty_growth_per_sqrt_hour: 0.02

features:
  min_reference_group_size: 8
  mad_epsilon: 0.000000001
  ewma_alpha: 0.25
  cusum_drift: 0.50
  cusum_threshold: 2.50

decision:
  hard_limit_precedence: true
  high_ood_blocks_risk_reject: true
  high_uncertainty_blocks_risk_reject: true
  ood_unknown_status: true