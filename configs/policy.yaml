schema_version: '1.0'
decision_states:
  allowed:
  - SAFE
  - REVIEW
  - REJECT
  - UNKNOWN
  precedence:
  - REJECT
  - UNKNOWN
  - REVIEW
  - SAFE
objective:
  primary: minimize_catastrophic_false_negatives
  secondary: control_false_positive_rejection
  forbid_trivial_all_reject_solution: true
  require_operational_constraint: true
costs:
  false_negative: 100.0
  false_positive: 1.0
  uncertain_decision: 0.25
  data_quality_failure: 10.0
  ood_misclassification: 50.0
  costs_are_tunable: true
  values_are_initial_assumptions: true
hard_limit_policy:
  enabled: true
  source_priority:
  - incoming_authoritative_specification
  - validated_screening_profile
  - approved_component_profile
  - generic_config_fallback
  generic_config_fallback_allowed: false
  absolute_violation_action: REJECT
  near_limit_requires_uncertainty_check: true
  near_limit_fraction: 0.95
risk_score:
  scale_min: 0.0
  scale_max: 1.0
  interpretation: calibrated risk estimate, not probability unless calibration is
    demonstrated
  thresholds:
    safe_max: 0.35
    review_max: 0.6
    reject_min: 0.6
  thresholds_are_initial_software_defaults: true
  must_be_selected_on_validation_data: true
  selection_objective:
    primary: minimum_false_negative_rate
    constraint: acceptable_false_positive_rate
  evidence_thresholds:
    high_channel_min: 0.6
    joint_high_min: 0.6
uncertainty:
  enabled: true
  high_uncertainty_action: REVIEW
  insufficient_evidence_action: UNKNOWN
  prediction_interval:
    required_for_future_value_decision: true
    minimum_coverage_target: 0.9
  anomaly_calibration_required: true
ood:
  enabled: true
  severe_ood_action: REVIEW
  unknown_semantics_action: UNKNOWN
  component_family_unseen_action: REVIEW
  stress_regime_unseen_action: REVIEW
  ood_never_silent: true
  dataset_status:
    severe_part_fraction_min: 0.05
    moderate_part_fraction_min: 0.1
data_quality:
  minimum_rows: 1
  minimum_parts: 1
  maximum_missing_fraction: 0.4
  maximum_duplicate_fraction: 0.01
  require_part_identifier: true
  require_parameter_identifier: true
  require_value_or_censoring: true
  invalid_unit_action: UNKNOWN
  unresolved_semantic_mapping_action: UNKNOWN
  malformed_timestamps_action: UNKNOWN
minimum_evidence:
  anomaly:
    minimum_lot_size: 20
    minimum_population_reference: 10
    otherwise_action: UNKNOWN
  forecast:
    minimum_observed_readpoints: 2
    minimum_future_separation_h: 1.0
    otherwise_action: UNKNOWN
  decision:
    require_anomaly_or_forecast_evidence: true
    require_data_quality_pass: true
review_triggers:
  any:
  - moderate_anomaly_score
  - prediction_interval_crosses_limit
  - severe_ood
  - high_missingness
  - conflicting_module_outputs
  - uncertain_policy_threshold
reject_triggers:
  any:
  - absolute_hard_limit_violation
  - calibrated_high_failure_risk
  - calibrated_high_anomaly_risk_with_supporting_evidence
safety_override:
  enabled: true
  rules:
    absolute_hard_limit_violation: REJECT
    unknown_parameter_semantics: UNKNOWN
    insufficient_data: UNKNOWN
    severe_data_corruption: UNKNOWN
    severe_ood: REVIEW
  cannot_be_overridden_by_model: true
explainability:
  required: true
  minimum_reasons: 1
  include:
  - decision_state
  - risk_score
  - uncertainty
  - absolute_limit_status
  - lot_relative_evidence
  - temporal_evidence
  - forecast_evidence
  - ood_status
  - data_quality_status
  human_readable: true
confidence_thresholds:
  high_uncertainty_max: 0.3
  moderate_uncertainty_max: 0.7
  low_quality_min: 0.6
