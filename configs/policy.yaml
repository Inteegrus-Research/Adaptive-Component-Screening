schema_version: "3.0-final-early-dynamics"
decision_states: [SAFE, REVIEW, REJECT, UNKNOWN]
precedence: [REJECT, UNKNOWN, REVIEW, SAFE]
calibration:
  split: val
  test_locked: true
  early_slope_reject: constrained_validation_search
  healthy_constraints:
    max_action_rate: 0.10
    max_review_rate: 0.20
    min_recall: 0.90
    max_critical_escapes: 0
OOD:
  moderate_quantile: 0.95
  severe_quantile: 0.99
  unknown_family_fraction: 0.05
safety_overrides:
  absolute_limit_violation: REJECT
  predicted_limit_crossing_when_reliable: REJECT
early_dynamics:
  field: max_slope_normalized
  role: direct_validation_calibrated_reject_gate
forecast:
  target_horizon_h: 168
  conformal_nominal_coverage: 0.95
