[build-system]
requires = ["setuptools>=75", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-screening"
version = "0.1.0"
description = "Adaptive predictive component screening pipeline"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
